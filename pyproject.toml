[project]
name = "champions-metadesk-studio"
version = "0.3.0"
description = "All-in-one competitive Pokémon workbench: Box roster, team builder, live tournament meta analytics, and damage calculations."
authors = [
    {name = "Jason Arias", email = "jn.arias@uniandes.edu.co"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.13,<3.16"
keywords = ["pokemon", "vgc", "pokemon-champions", "damage-calculator", "team-builder", "flet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "flet (>=0.85.3,<0.86.0)",
    "flet-desktop (>=0.85.3,<0.86.0)"
]

[project.urls]
Homepage = "https://github.com/JsNcAr/champions-metadesk-studio"
Repository = "https://github.com/JsNcAr/champions-metadesk-studio"
Releases = "https://github.com/JsNcAr/champions-metadesk-studio/releases"
Changelog = "https://github.com/JsNcAr/champions-metadesk-studio/blob/main/CHANGELOG.md"
Issues = "https://github.com/JsNcAr/champions-metadesk-studio/issues"

[project.scripts]
champions-metadesk = "pokemon_champions_planning_tool.main:run"
metadesk = "pokemon_champions_planning_tool.main:run"

[tool.poetry]
packages = [{include = "pokemon_champions_planning_tool", from = "src"}]


[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.22.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
