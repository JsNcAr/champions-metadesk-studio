name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: champions-metadesk-linux-x64
            asset_path: dist/champions-metadesk-linux-x64.tar.gz
          - os: windows-latest
            artifact_name: champions-metadesk-windows-x64
            asset_path: dist/champions-metadesk-windows-x64.zip
          - os: macos-latest
            artifact_name: champions-metadesk-macos
            asset_path: dist/champions-metadesk-macos.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libmpv-dev

      - name: Install Python dependencies
        run: poetry install --no-interaction

      # --- Build Linux ---
      - name: Build standalone executable (Linux)
        if: runner.os == 'Linux'
        run: |
          poetry run flet pack run.py \
            -n "champions-metadesk" \
            --product-name "Champions MetaDesk Studio" \
            --add-data "src/pokemon_champions_planning_tool/data:pokemon_champions_planning_tool/data" \
            --add-data "src/pokemon_champions_planning_tool/domain/damage/reference_data.json:pokemon_champions_planning_tool/domain/damage" \
            -y
          cd dist
          tar -czf champions-metadesk-linux-x64.tar.gz champions-metadesk
          cd ..

      # --- Build Windows ---
      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          poetry run flet pack run.py -n "champions-metadesk" --product-name "Champions MetaDesk Studio" --add-data "src/pokemon_champions_planning_tool/data;pokemon_champions_planning_tool/data" --add-data "src/pokemon_champions_planning_tool/domain/damage/reference_data.json;pokemon_champions_planning_tool/domain/damage" -y
          Compress-Archive -Path dist\champions-metadesk.exe -DestinationPath dist\champions-metadesk-windows-x64.zip

      # --- Build macOS ---
      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          poetry run flet pack run.py \
            -n "ChampionsMetaDeskStudio" \
            --product-name "Champions MetaDesk Studio" \
            --bundle-id "com.champions.metadesk" \
            --add-data "src/pokemon_champions_planning_tool/data:pokemon_champions_planning_tool/data" \
            --add-data "src/pokemon_champions_planning_tool/domain/damage/reference_data.json:pokemon_champions_planning_tool/domain/damage" \
            -y
          cd dist
          zip -r -y champions-metadesk-macos.zip ChampionsMetaDeskStudio.app
          cd ..

      - name: Upload artifact to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

