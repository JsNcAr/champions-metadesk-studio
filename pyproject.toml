[project]
name = "champions-metadesk-studio"
version = "0.1.0"
description = "All-in-one competitive Pokémon workbench: Box roster, team builder, live tournament meta analytics, and damage calculations."
authors = [
    {name = "JsNcAr",email = "jn.arias@uniandes.edu.co"}
]
readme = "README.md"
requires-python = ">=3.13,<3.16"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "flet (>=0.85.3,<0.86.0)",
    "flet-desktop (>=0.85.3,<0.86.0)"
]

[project.scripts]
champions-metadesk = "pokemon_champions_planning_tool.main:run"
metadesk = "pokemon_champions_planning_tool.main:run"

[tool.poetry]
packages = [{include = "pokemon_champions_planning_tool", from = "src"}]


[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.22.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
